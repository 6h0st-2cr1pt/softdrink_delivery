{% extends 'delivery/base.html' %}

{% block content %}
<h2><i class="fas fa-shopping-cart"></i> Place an Order</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <h3>Select Products:</h3>
    <div class="product-grid">
        {% for product in product_list %}
        <div class="product-card">
            <img src="{{ product.image.url }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p>${{ product.price }} per {{ product.get_unit_display }}</p>
            <label>
                <input type="checkbox" name="items" value="{{ product.pk }},0" data-product-id="{{ product.pk }}">
                Add to Order
            </label>
            <input type="number" name="quantity_{{ product.pk }}" value="1" min="1" class="product-quantity" data-product-id="{{ product.pk }}">
        </div>
        {% endfor %}
    </div>
    <button type="submit" class="btn"><i class="fas fa-check"></i> Place Order</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        const checkboxes = document.querySelectorAll('input[type="checkbox"][name="items"]');
        checkboxes.forEach(function(checkbox) {
            if (checkbox.checked) {
                const productId = checkbox.dataset.productId;
                const quantity = document.querySelector(`.product-quantity[data-product-id="${productId}"]`).value;
                checkbox.value = `${productId},${quantity}`;
            }
        });
    });
});
</script>
{% endblock %}
