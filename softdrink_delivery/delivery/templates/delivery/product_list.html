{% extends 'delivery/base.html' %}

{% block content %}
<h2><i class="fas fa-box"></i> Available Products</h2>
<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <h3>{{ product.name }}</h3>
        <p>${{ product.price }} per {{ product.get_unit_display }}</p>
        <a href="{% url 'product_detail' product.pk %}" class="btn"><i class="fas fa-info-circle"></i> View Details</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
